# Optional research credential drop-in for a provisioned deployment.
#
# Install only when the research runtime is explicitly provisioned. Research
# stays disabled and unconfigured by default; an absent credential must not
# block ordinary startup. The credential identifier is non-secret
# configuration (KRONIKA_AI_CONFIG_PATH research section) and the value
# lives only in the root-owned credential source named below.
[Service]
LoadCredential=KRONIKA_RESEARCH_OPENAI_API_KEY:/etc/kronika/credentials/research-openai
