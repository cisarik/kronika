<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic X composer fixture</title>
  </head>
  <body>
    <article data-kronika-post data-testid="tweet">
      <a href="https://x.com/fixture/status/123456789">permalink</a>
      <time>now</time>
      <div data-testid="tweetPhoto" data-kronika-media>
        <img alt="" width="120" height="80" />
      </div>
      <div role="group" aria-label="Tweet actions">
        <div>
          <button type="button" data-testid="reply" aria-label="Reply">Reply</button>
        </div>
        <div>
          <button type="button" data-testid="retweet" aria-label="Repost">Repost</button>
        </div>
        <div>
          <button type="button" data-testid="like" aria-label="Like">Like</button>
        </div>
        <div>
          <button type="button" data-testid="bookmark" aria-label="Bookmark">Bookmark</button>
        </div>
        <div>
          <button type="button" aria-label="Share post">Share</button>
        </div>
      </div>
    </article>
    <form data-kronika-composer data-kronika-composer-chrome>
      <div data-kronika-composer-text-row>
        <input type="number" data-kronika-composer-row-canary="" tabindex="-1" aria-hidden="true" />
        <div
          data-testid="tweetTextarea_0"
          contenteditable="true"
          role="textbox"
          aria-label="Post your reply"
        ></div>
      </div>
      <div data-testid="toolBar" data-kronika-composer-toolbar role="toolbar" aria-label="Composer tools">
        <div>
          <button type="button" aria-label="Content disclosure" data-kronika-content-disclosure>
            Everyone
          </button>
        </div>
      </div>
      <input data-kronika-composer-file type="file" accept="image/*,video/mp4" />
      <button type="button" data-testid="tweetButton" id="must-not-click">Post</button>
    </form>
    <div id="inline-reply-only-editable">
      <div
        data-testid="tweetTextarea_0"
        contenteditable="true"
        role="textbox"
        aria-label="Post your reply"
      ></div>
      <div data-testid="toolBar" role="toolbar" aria-label="Composer tools">
        <button type="button" data-testid="fileInput" aria-label="Add photos or video">Media</button>
      </div>
      <input type="file" accept="image/*,video/mp4" />
    </div>
    <div id="inline-reply-deep">
      <div>
        <div>
          <div>
            <div>
              <div>
                <div>
                  <div>
                    <div>
                      <div>
                        <div>
                          <div>
                            <div>
                              <div>
                                <div>
                                  <div>
                                    <div
                                      data-testid="tweetTextarea_0"
                                      contenteditable="true"
                                      role="textbox"
                                      aria-label="Post your reply"
                                    ></div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div data-testid="toolBar" role="toolbar" aria-label="Composer tools">
        <button type="button" data-testid="fileInput" aria-label="Add photos or video">Media</button>
      </div>
      <input type="file" accept="image/*,video/mp4" />
    </div>
    <div id="inline-reply-missing-file">
      <div
        data-testid="tweetTextarea_0"
        contenteditable="true"
        role="textbox"
        aria-label="Post your reply"
      ></div>
      <div data-testid="toolBar" role="toolbar" aria-label="Composer tools"></div>
    </div>
  </body>
</html>
