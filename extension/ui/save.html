<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Kronika</title>
    <link rel="stylesheet" href="save.css" />
  </head>
  <body>
    <main>
      <form id="save-form" autocomplete="off">
        <div class="header">
          <h1>Save to Kronika</h1>
          <button id="close" type="button" aria-label="Close">X</button>
        </div>
        <div class="fields">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="240" spellcheck="true" autocomplete="off" tabindex="-1" />
          <label for="tag-search">Tags</label>
          <div class="tag-search-panel">
            <input
              id="tag-search"
              name="fn-canonical-tag-query"
              type="text"
              maxlength="64"
              spellcheck="false"
              placeholder="Search tags"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="tag-suggestions"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              data-1p-ignore="true"
              data-lpignore="true"
              data-form-type="other"
              tabindex="-1"
            />
            <div id="tag-suggestions" class="tag-suggestions" role="listbox"></div>
          </div>
          <div id="selected-tags" class="selected-tags" aria-live="polite"></div>
          <p id="tags-status" class="status"></p>
          <label for="description">Description</label>
          <textarea id="description" name="description" maxlength="10000" rows="4" autocomplete="off" tabindex="-1"></textarea>
          <p id="form-status" class="status" role="status"></p>
        </div>
        <div class="actions">
          <button id="save" type="submit">Save</button>
        </div>
      </form>
    </main>
    <script src="../shared/messages.js"></script>
    <script src="save.js"></script>
  </body>
</html>
